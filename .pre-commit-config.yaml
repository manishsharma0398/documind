# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Adapted from prasaarit/services/upload. That copy is a monorepo service, so
# every hook there needs `--project services/upload` and repo-root-relative path
# args. Here pyproject.toml sits at the repo root, which is also pre-commit's
# cwd, so the plain commands resolve correctly.
# `pre-commit install` alone only wires the pre-commit stage; the commit-msg
# hook below would then silently never run.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Conventional Commits are what release-please reads to decide the version
  # bump. Enforced at commit time, because a bad message is only fixable by
  # rewriting history once it has been pushed.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: uv-lock
        name: uv-lock
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true

      - id: black
        name: black
        entry: uv run --group lint black
        language: system
        types: [python]

      - id: isort
        name: isort
        entry: uv run --group lint isort
        language: system
        types: [python]

      - id: flake8
        name: flake8
        entry: uv run --group lint flake8
        language: system
        pass_filenames: false
        types: [python]
        args: ["--max-line-length=88", "src/", "evals/"]

      - id: bandit
        name: bandit
        entry: uv run --group lint bandit
        language: system
        pass_filenames: false
        types: [python]
        args: ["-r", "src/", "evals/"]

      - id: pyright
        name: pyright
        entry: uv run --group lint pyright
        language: system
        pass_filenames: false
        types: [python]
