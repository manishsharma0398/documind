name: release-please

on:
  push:
    branches: [master]

# Needed to open the release PR and to create the tag and GitHub release.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Maintains a rolling "chore(master): release X.Y.Z" PR. Merging it
      # tags the release, writes CHANGELOG.md and bumps the version in
      # pyproject.toml. The bump is derived from the Conventional Commit
      # types since the last release -- fix: patch, feat: minor, ! : major.
      # Manifest mode. The `python` release type alone only knows setup.py,
      # setup.cfg and Poetry-style pyproject files -- it does not recognise
      # PEP 621 `[project] version`, so the version was never bumped. The
      # explicit toml updater in release-please-config.json fixes that.
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # uv.lock records the project's OWN version, so a release bump desyncs it
      # from pyproject.toml and `uv sync --locked` then fails on the release PR.
      # release-please ships no updater for uv.lock, so regenerate it on the
      # release branch. This pushes a second commit, which re-runs the PR
      # checks -- they pass on that second run.
      - uses: actions/checkout@v7
        if: ${{ steps.rp.outputs.pr }}
        with:
          ref: ${{ fromJSON(steps.rp.outputs.pr).headBranchName }}

      - uses: astral-sh/setup-uv@v7
        if: ${{ steps.rp.outputs.pr }}
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync uv.lock with the released version
        if: ${{ steps.rp.outputs.pr }}
        run: |
          set -euo pipefail
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync uv.lock with released version"
          git push
