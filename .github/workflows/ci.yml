name: ci

on:
  pull_request:
  push:
    branches: [master]

# A new push to the same ref makes the in-flight run obsolete. Cancel it
# rather than paying for a result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    uses: ./.github/workflows/version.yml

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      # --locked fails if uv.lock is stale rather than silently resolving
      # something different from what a developer has installed locally.
      - name: Install dependencies
        run: uv sync --locked --group dev --group lint

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Same hooks developers run locally, so CI cannot disagree with them.
      - name: Lint, format and security checks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        run: |
          set +e
          uv run pytest --cov=src --cov-report=term-missing
          code=$?
          # 5 == no tests collected. Drop this guard once tests exist.
          if [ "$code" -eq 5 ]; then
            echo "::warning title=tests::no tests collected yet"
            exit 0
          fi
          exit $code
