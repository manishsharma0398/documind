# The golden set: questions, and which sources genuinely answer them.
#
# `expected_sources` are paths relative to INGEST_ROOT — the same value the API
# returns as `source`. Never chunk ids; those are regenerated on every ingest.
#
# Write the questions from memory before looking at the corpus. Reading a chunk
# first leaks its vocabulary into the question and flatters dense retrieval.
# And never let /retrieve decide `expected_sources` — if it misses a document,
# recording its miss as the truth makes the eval score itself 100% forever.
#
# Target mix (~30 total):
#   factual         ~10   one document clearly answers it
#   ambiguous-term  ~10   a term spanning domains with comparable pools;
#                         `caching` and `retry` are the two that qualify here
#   multi-hop        ~6   needs two documents from different areas
#   absent           ~5   plausible, and genuinely not in the corpus
#
# Draw only from ai, node-learnings, js-learnings, terraform and sql. Questions
# about AWS, Docker, K8s, Linux, CI/CD or scripting measure the corpus's holes.

questions:
  # --- example, replace or delete -------------------------------------------
  - id: node-backpressure-01
    type: factual
    question: what happens when a stream writes faster than the other end reads
    expected_sources:
      - node-learnings/07-streams-backpressure/README.md
      - node-learnings/07-streams-backpressure/notes.md
      - node-learnings/07-streams-backpressure/interview.md
    # Optional: substrings a correct answer should contain. Unused by retrieval
    # metrics; /ask will score against these later.
    expected_answer_contains:
      - drain

  - id: langchain-output-parsers-01
    type: factual
    question: how do I get a structured object back from a model instead of a string
