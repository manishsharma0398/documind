[project]
name = "documind"
version = "0.6.1"
description = "Retrieval-augmented Q&A service for large personal knowledge bases"
readme = "README.md"
authors = [{ name = "Manish Sharma", email = "manish.sharma0398@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain-text-splitters>=1.1.2",
    "openai>=3.3.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-json-logger>=4.2.0",
    "qdrant-client>=1.19.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
dev = "src.main:app"

[tool.uv.build-backend]
module-root = ""
module-name = "src"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pre-commit>=4.5.1", "pytest>=9.1.1", "pytest-cov>=7.1.0"]
lint = [
    "bandit>=1.9.4",
    "pyright>=1.1.406",
    "black>=26.3.1",
    "flake8>=7.3.0",
    "flake8-pyproject>=1.2.4",
    "isort>=8.0.1",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
# The engine behind Pylance, so the hook reports what the editor already shows.
typeCheckingMode = "standard"
